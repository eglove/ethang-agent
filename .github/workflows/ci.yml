name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-coverage:
    name: Build & Test (coverage)
    runs-on: windows-latest
    timeout-minutes: 30  # outer bound: no step may hold the runner hostage past this

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      # Always run (not cache-gated): coverage collection depends on it.
      # 'update' installs when missing, so this is idempotent.
      # Coverage comes from the MTP CodeCoverage extension switches on the
      # dotnet test command line below (dotnet-coverage wrapping cannot reach
      # the MTP test executable chain, so the standalone tool is not used).

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          # Coverage imports VS-XML produced by dotnet-coverage below.
          # NOTE: SonarSource C# properties end in 'reporTSPaths' (plural) - the
          # previously used 'cs.cobertura.reportPaths' (singular) was silently
          # ignored, yielding green analyses with 0% coverage every run.
          # SONAR_TOKEN reaches the scanner through the step env above; expanding
          # the secret into the command line would put it in process argv.
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"eglove_ethang-agent" /o:"eglove" /d:sonar.cs.vscoveragexml.reportsPaths="${{ github.workspace }}/coverage-vs/merged.coveragexml"
          dotnet build eThangAgent.slnx -c Release --nologo
          $buildExit = $LASTEXITCODE
          # Circuit breaker + coverage: a hung test produces a dump + log under
          # TestResults/ instead of freezing the runner until the next push cancels
          # it (runs 32923889217, 32918551633). xunit.v3 runs on Microsoft.Testing
          # .Platform (global.json test runner); hang protection and coverage both
          # ride MTP extension switches after the argument separator.
          dotnet test --solution eThangAgent.slnx -c Release --no-build -- --hangdump --hangdump-timeout 5m --hangdump-type mini --coverage --coverage-output "${{ github.workspace }}\coverage-vs\merged.coveragexml" --coverage-output-format xml
          $testExit = $LASTEXITCODE
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end
          $endExit = $LASTEXITCODE
          if ($buildExit -ne 0) { exit $buildExit }
          if ($testExit -ne 0) { exit $testExit }
          exit $endExit

      - name: Upload coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: ./coverage-vs/merged.coveragexml
          if-no-files-found: error

      # Autopsy material: when the MTP HangDump circuit breaker fires it writes a
      # minidump plus the hung-test log here. CI-only testhost lingering (all tests pass,
      # host refuses to exit) has no local repro - these files are the evidence.
      - name: Upload test diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          path: |
            ./TestResults/**/*.dmp
            ./TestResults/**/*.log
          if-no-files-found: ignore

  lint:
    name: Lint (dotnet format)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Verify formatting
        run: dotnet format eThangAgent.slnx --verify-no-changes --severity warn
