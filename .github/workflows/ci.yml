name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-coverage:
    name: Build & Test (coverage)
    runs-on: windows-latest
    timeout-minutes: 60  # outer bound: no step may hold the runner hostage past this (30 was exceeded by the keep-alive Desktop suite under coverage instrumentation — no hangdump fired, the testhost was progressing)

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      # Always run (not cache-gated): coverage collection depends on it.
      # 'update' installs when missing, so this is idempotent.
      - name: Install dotnet-coverage
        run: dotnet tool update --global dotnet-coverage

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          # Coverage imports VS-XML produced by dotnet-coverage below.
          # NOTE: SonarSource C# properties end in 'reporTSPaths' (plural) - the
          # previously used 'cs.cobertura.reportPaths' (singular) was silently
          # ignored, yielding green analyses with 0% coverage every run.
          # SONAR_TOKEN reaches the scanner through the step env above; expanding
          # the secret into the command line would put it in process argv.
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"eglove_ethang-agent" /o:"eglove" /d:sonar.cs.vscoveragexml.reportsPaths="${{ github.workspace }}/coverage-vs/merged.coveragexml"
          dotnet build eThangAgent.slnx -c Release --nologo
          $buildExit = $LASTEXITCODE
          # Circuit breaker: a hung test produces a dump + log under TestResults/
          # instead of freezing the runner until the next push cancels it (runs
          # 32923889217, 32918551633) - the MTP --hangdump switches ride after the
          # argument separator and work under wrapping. Coverage collection wraps
          # the WHOLE dotnet test invocation: a solution run fans out to one test
          # executable per test project (18), and the per-process MTP --coverage
          # switch makes every project write the same output file - last writer
          # wins, so Sonar imported a single project's modules and master coverage
          # collapsed 88% -> 11.5% (analyses of 2026-08-29). Wrapping merges all
          # modules into the one VS-XML report Sonar imports.
          dotnet-coverage collect "dotnet test --solution eThangAgent.slnx -c Release --no-build -- --hangdump --hangdump-timeout 5m --hangdump-type mini" -f xml -o "${{ github.workspace }}\coverage-vs\merged.coveragexml"
          $testExit = $LASTEXITCODE
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end
          $endExit = $LASTEXITCODE
          if ($buildExit -ne 0) { exit $buildExit }
          if ($testExit -ne 0) { exit $testExit }
          exit $endExit

      - name: Upload coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: ./coverage-vs/merged.coveragexml
          if-no-files-found: error

      # Autopsy material: when the MTP HangDump circuit breaker fires it writes a
      # minidump plus the hung-test log here. CI-only testhost lingering (all tests pass,
      # host refuses to exit) has no local repro - these files are the evidence.
      - name: Upload test diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          path: |
            ./TestResults/**/*.dmp
            ./TestResults/**/*.log
          if-no-files-found: ignore

  # NON-REQUIRED, SECRET-GATED, BOUNDED (issue #289). This job exists to notice when the HARNESS
  # regresses against a real model's actual behaviour - the one thing no fake-provider suite can
  # see, because a fake is written by the same person who wrote the code under test.
  #
  # It is deliberately NOT part of build-test-coverage and must never be made a required check:
  # a free model rate-limits and queues, so blocking a merge on it would block merges on weather.
  # Every assertion is about an artifact THIS repository controls (the wire round trip, the typed
  # error reaching the model, the transcript's losslessness, the change report, the usage row), so
  # a red run means the harness broke - not that the model had a bad day. Tier 2 (procedure
  # measurement) is recorded to an artifact and never fails the build.
  live-model:
    name: Live model (non-required)
    runs-on: windows-latest
    # Two live sessions, each a real turn against a free model that queues: generous, and still a
    # bound, so a wedged provider cannot hold the runner.
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # A fork's PR has no secret, and an offline runner has no network: both are ordinary states,
      # so the job SKIPS with a clear message instead of failing. The tests also skip at runtime
      # when the key is absent; this gate exists for the reader - a skipped JOB says why.
      - name: Check for the live-model secret
        id: gate
        shell: powershell
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENROUTER_API_KEY)) {
            Write-Host '::notice::OPENROUTER_API_KEY is not configured - skipping the live-model suite.'
            'enabled=false' >> $env:GITHUB_OUTPUT
          } else {
            'enabled=true' >> $env:GITHUB_OUTPUT
          }

      - name: Build the live-model suite
        if: steps.gate.outputs.enabled == 'true'
        run: dotnet build tests/eThangAgent.LiveModel.Tests/eThangAgent.LiveModel.Tests.csproj -c Release --nologo

      # ONLY the LiveModel trait: the suite's baseline-comparison tests are free and offline,
      # and already run in build-test-coverage. --hangdump is the same circuit breaker the main
      # job uses, so a wedged turn produces evidence instead of freezing the runner.
      - name: Run the live-model suite
        if: steps.gate.outputs.enabled == 'true'
        shell: powershell
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          dotnet test tests/eThangAgent.LiveModel.Tests/eThangAgent.LiveModel.Tests.csproj -c Release --no-build --filter-trait 'Category=LiveModel' -- --hangdump --hangdump-timeout 10m --hangdump-type mini

      # Tier 2's output is the TREND: uploaded per run so a drop is visible without anyone
      # remembering to look. Carried on failure too, because a failing run's measurement is the
      # one worth reading.
      - name: Upload the Tier-2 measurement
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-model-tier2
          path: tests/eThangAgent.LiveModel.Tests/bin/Release/net10.0-windows/tier2-live-run.json
          if-no-files-found: warn

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-model-diagnostics
          path: |
            ./TestResults/**/*.dmp
            ./TestResults/**/*.log
          if-no-files-found: ignore

  lint:
    name: Lint (dotnet format)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Verify formatting
        run: dotnet format eThangAgent.slnx --verify-no-changes --severity warn
