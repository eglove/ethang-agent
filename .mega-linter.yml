# MegaLinter Configuration for eThang Agent
# See: https://megalinter.io/latest/configuration/

# Disable linters that are not relevant to a C#/NET codebase or cause environment issues
DISABLE_LINTERS:
  - REPOSITORY_OSV_SCANNER   # No lockfiles to scan (C# uses .csproj, not npm/go/gem locks)
  - REPOSITORY_TRIVY         # Vuln-DB download is unreliable on runners; osv-scanner covers supply-chain
  - REPOSITORY_GRYPE         # Same vuln-DB download issue as trivy
  - CSHARP_ROSLYNATOR        # CLI analysis misses MVVM source-generated properties -> phantom CS1061 errors
  - SPELL_CSPELL             # Spell-checking flags domain terms and proper nouns across docs/code
  - ACTION_ZIZMOR            # Audits query the GitHub API (401 Unauthorized without a runner token) - cannot function in CI
